name: Build and Test
run-name: "Build and Test ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: crashappsec/action-checkout@main
              with:
                chalk: ${{ env.CHALK_ON }}
                profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
                lfs: false
            - name: Assert instrumentation is live
              if: env.CHALK_ON == 'true'
              continue-on-error: true
              run: |
                test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 18
            - name: Setup Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  components: rustfmt, clippy
            - name: Install wasm-pack
              run: cargo install wasm-pack
            - name: Download circom v2.1.9 (Linux)
              continue-on-error: true   # racecar: scan/report/push step, must not fail the build
              run: wget https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64 -O /usr/local/bin/circom && chmod +x /usr/local/bin/circom
            - name: Install yarn
              run: npm install -g yarn
            - name: Install dependencies
              run: yarn install  --immutable
            - name: Install bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest
            - name: Run tests
              run: yarn test
